<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LNChat</title>

    <!-- PeerJS handles WebRTC signaling -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <style>
        /* ---------- Theme colors ---------- */
        :root {
            --bg: #202124;
            --panel: #292a2d;
            --input-bg: #18191b;
            --border: #45474b;
            --text: #eeeeee;
            --muted: #a9adb3;
            --hover: #3d4147;
            --button: #35383d;
            --button-hover: #45494f;
            --msg-me: #3b3e43;
            --danger: #d34b4b;
            --online: #55b86a;
            --away: #d5a943;
        }

        /* ---------- Base ---------- */
        * { box-sizing: border-box; }

        body {
            height: 100vh;
            margin: 0;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            font-size: 14px;
        }

        button, input { font: inherit; }

        button {
            border: 1px solid #5b5e63;
            border-radius: 4px;
            background: var(--button);
            color: var(--text);
            cursor: pointer;
        }
        button:hover { background: var(--button-hover); }
        button:disabled { opacity: 0.5; cursor: default; }

        input {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: var(--input-bg);
            color: var(--text);
            outline: none;
        }
        input:focus { border-color: #777; }

        /* ---------- Layout ---------- */
        #app { display: flex; width: 100%; height: 100%; }

        #sidebar {
            display: flex;
            flex-direction: column;
            width: 260px;
            min-width: 220px;
            background: var(--panel);
            border-right: 1px solid var(--border);
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
        }

        h2 {
            margin: 0 0 12px;
            font-size: 18px;
            font-weight: 500;
        }

        /* Shows "You: <id>" once connected */
        #current-user {
            margin-bottom: 12px;
            padding: 6px 8px;
            border-radius: 4px;
            background: var(--hover);
            color: var(--muted);
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Row with peer ID input and Connect button */
        .connect-row { display: flex; gap: 6px; }
        .connect-row input { min-width: 0; }
        .connect-row button { padding: 0 11px; white-space: nowrap; }

        /* ---------- Contact list ---------- */
        #contact-list {
            flex: 1;
            overflow-y: auto;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .contact {
            display: flex;
            align-items: center;
            gap: 8px;
            min-height: 44px;
            padding: 0 10px 0 16px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
        }
        .contact:hover,
        .contact.active { background: var(--hover); }
        .contact.active { box-shadow: inset 3px 0 0 var(--text); }

        .contact-name {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Colored presence dot */
        .dot {
            width: 9px;
            height: 9px;
            flex: 0 0 9px;
            border-radius: 50%;
            background: var(--danger);
        }
        .dot.online  { background: var(--online); }
        .dot.away    { background: var(--away); }

        /* Small × button on each row */
        .remove {
            width: 22px;
            height: 22px;
            padding: 0;
            border: none;
            background: transparent;
            color: var(--muted);
            font-size: 15px;
            line-height: 1;
            opacity: 0.35;
        }
        .contact:hover .remove,
        .contact.active .remove { opacity: 1; }
        .remove:hover { background: var(--danger); color: #fff; }

        /* ---------- Chat area ---------- */
        #main { display: flex; flex: 1; min-width: 0; flex-direction: column; }

        #chat {
            display: flex;
            flex: 1;
            min-height: 0;
            flex-direction: column;
            padding: 18px;
        }

        #messages {
            display: flex;
            flex: 1;
            min-height: 0;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
            padding: 4px 4px 14px 0;
        }

        .empty {
            margin: auto;
            color: var(--muted);
            text-align: center;
        }

        .msg {
            max-width: min(70%, 650px);
            padding: 8px 11px;
            border: 1px solid var(--border);
            border-radius: 4px;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }
        .msg.me   { align-self: flex-end;   background: var(--msg-me); }
        .msg.them { align-self: flex-start; background: var(--panel); }

        .msg-sender { display: block; margin-bottom: 3px; color: var(--muted); font-size: 11px; }
        .msg-time   { display: block; margin-top: 5px;  color: var(--muted); font-size: 11px; }

        .input-row {
            display: flex;
            gap: 7px;
            padding-top: 10px;
            border-top: 1px solid var(--border);
        }
        .input-row input { flex: 1; min-width: 0; height: 36px; }
        .input-row button { padding: 0 16px; }

        /* ---------- Overlays (setup + confirm) ---------- */
        .overlay {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(20, 21, 22, 0.96);
        }

        .card {
            width: 100%;
            max-width: 360px;
            padding: 22px;
            border: 1px solid #5b5e63;
            border-radius: 5px;
            background: var(--panel);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
        }

        .card h1 { margin: 0 0 16px; font-size: 20px; font-weight: 500; }
        .card label { display: block; margin-bottom: 5px; color: var(--muted); }
        .card input { height: 36px; }
        .card button { width: 100%; height: 36px; margin-top: 18px; }

        #setup-status {
            min-height: 17px;
            margin: 12px 0 0;
            text-align: center;
            font-size: 12px;
            color: var(--muted);
        }
        #setup-status.error { color: #d6a3a3; }

        /* Confirm dialog sits on top of everything */
        #confirm-overlay {
            display: none;
            z-index: 20;
            background: rgba(20, 21, 22, 0.75);
        }
        #confirm-overlay.show { display: flex; }

        #confirm-overlay .card { max-width: 320px; }
        #confirm-overlay p { margin: 0 0 16px; overflow-wrap: anywhere; }

        .confirm-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }
        .confirm-actions button {
            width: auto;
            height: auto;
            margin: 0;
            padding: 6px 14px;
        }
        #confirm-remove {
            background: var(--danger);
            border-color: var(--danger);
            color: #fff;
        }
        #confirm-remove:hover { background: #b83e3e; }

        /* ---------- Small screens ---------- */
        @media (max-width: 650px) {
            #sidebar { width: 200px; min-width: 160px; }
            .msg { max-width: 85%; }
            .connect-row { flex-direction: column; }
            .connect-row button { height: 34px; }
        }
    </style>
</head>

<body>
    <!-- ========== Setup overlay ========== -->
    <div class="overlay" id="setup-overlay">
        <div class="card">
            <h1>LNChat</h1>
            <label for="my-id">Your ID</label>
            <input id="my-id" type="text" maxlength="40" autocomplete="off" spellcheck="false">
            <button id="start-btn" type="button">Start</button>
            <p id="setup-status"></p>
        </div>
    </div>

    <!-- ========== Main UI ========== -->
    <div id="app">
        <aside id="sidebar">
            <div class="sidebar-header">
                <h2>LNChat</h2>
                <div id="current-user">Not connected</div>
                <div class="connect-row">
                    <input id="remote-id" type="text" maxlength="40" autocomplete="off" placeholder="Peer ID">
                    <button id="connect-btn" type="button">Connect</button>
                </div>
            </div>
            <ul id="contact-list"></ul>
        </aside>

        <main id="main">
            <section id="chat">
                <div id="messages">
                    <div class="empty">Select a contact</div>
                </div>
                <div class="input-row">
                    <input id="message-input" type="text" autocomplete="off" placeholder="Message..." disabled>
                    <button id="send-btn" type="button" disabled>Send</button>
                </div>
            </section>
        </main>
    </div>

    <!-- ========== Confirm removal overlay ========== -->
    <div class="overlay" id="confirm-overlay">
        <div class="card">
            <p>Remove <strong id="confirm-name"></strong> from your contacts?</p>
            <div class="confirm-actions">
                <button id="confirm-cancel" type="button">Cancel</button>
                <button id="confirm-remove" type="button">Remove</button>
            </div>
        </div>
    </div>

    <script>
        // ---------- State ----------
        let peer = null;               // our PeerJS instance
        let activePeerId = null;       // which contact's chat is open
        let pendingRemovalId = null;   // id waiting for confirm

        const connections = {};        // peerId -> RTCDataConnection

        const PRESENCE_INTERVAL = 3000; // how often we send "I'm here"
        const PRESENCE_TIMEOUT = 9000;  // how long before a peer is offline

        // ---------- DOM shortcuts ----------
        const $ = id => document.getElementById(id);

        const setupOverlay   = $("setup-overlay");
        const setupStatus    = $("setup-status");
        const startBtn       = $("start-btn");
        const myIdInput      = $("my-id");
        const remoteIdInput  = $("remote-id");
        const connectBtn     = $("connect-btn");
        const contactList    = $("contact-list");
        const messagesEl     = $("messages");
        const messageInput   = $("message-input");
        const sendBtn        = $("send-btn");
        const currentUserEl  = $("current-user");

        const confirmOverlay = $("confirm-overlay");
        const confirmName    = $("confirm-name");
        const confirmCancel  = $("confirm-cancel");
        const confirmRemove  = $("confirm-remove");

        // ---------- Helpers ----------

        // Random suggested ID like "quiet-fox-42"
        function randomId() {
            const adj = ["quiet","silver","blue","small","curious","calm","local","hidden","soft","north"];
            const ani = ["fox","badger","owl","otter","raven","hare","lynx","finch","moth","wolf"];
            const a = adj[Math.floor(Math.random() * adj.length)];
            const b = ani[Math.floor(Math.random() * ani.length)];
            return `${a}-${b}-${Math.floor(10 + Math.random() * 90)}`;
        }

        // Show a status line under the Start button
        function setStatus(text, isError = false) {
            setupStatus.textContent = text;
            setupStatus.classList.toggle("error", isError);
        }

        // "away" if tab is hidden, otherwise "online"
        function localStatus() {
            return document.hidden ? "away" : "online";
        }

        // Determine a contact's dot class
        function statusClass(id) {
            const c = connections[id];
            if (!c || !c.open) return "offline";
            if (!c.lastSeen || Date.now() - c.lastSeen > PRESENCE_TIMEOUT) return "offline";
            return c.status === "away" ? "away" : "online";
        }

        // Human-readable label for the dot tooltip
        function statusLabel(id) {
            const s = statusClass(id);
            return s === "online" ? "Online" : s === "away" ? "Away" : "Offline";
        }

        // ---------- Presence ----------

        // Tell every open connection whether we're online or away
        function broadcastPresence() {
            const msg = { type: "presence", status: localStatus(), time: Date.now() };
            Object.values(connections).forEach(c => { if (c.open) c.send(msg); });
            renderContacts();
        }

        setInterval(broadcastPresence, PRESENCE_INTERVAL);
        document.addEventListener("visibilitychange", broadcastPresence);

        // ---------- Start our peer ----------

        startBtn.addEventListener("click", startPeer);
        myIdInput.addEventListener("keydown", e => {
            if (e.key === "Enter") { e.preventDefault(); startPeer(); }
        });

        myIdInput.placeholder = randomId();

        function startPeer() {
            const id = myIdInput.value.trim();

            if (!id) { setStatus("Enter an ID", true); return; }
            if (!/^[A-Za-z0-9_-]{1,40}$/.test(id)) {
                setStatus("Letters, numbers, - and _ only", true);
                return;
            }

            setStatus("Connecting...");
            startBtn.disabled = true;
            myIdInput.disabled = true;

            peer = new Peer(id);

            // Successfully registered with the signaling server
            peer.on("open", actualId => {
                setupOverlay.style.display = "none";
                document.title = `LNChat — ${actualId}`;
                currentUserEl.textContent = `You: ${actualId}`;
                startBtn.disabled = false;
                myIdInput.disabled = false;
            });

            // Someone is connecting to us
            peer.on("connection", c => setupConnection(c));

            // Errors
            peer.on("error", err => {
                console.error("PeerJS error:", err);

                // Still on the setup screen
                if (setupOverlay.style.display !== "none") {
                    setStatus(err.type === "unavailable-id" ? "ID taken" : "Server error", true);
                    startBtn.disabled = false;
                    myIdInput.disabled = false;
                    return;
                }

                // Tried to connect to a peer that isn't online
                if (err.type === "peer-unavailable") {
                    remoteIdInput.placeholder = "Not reachable";
                    setTimeout(() => { remoteIdInput.placeholder = "Peer ID"; }, 2500);
                }
            });
        }

        // ---------- Connect to another peer ----------

        connectBtn.addEventListener("click", connectToPeer);
        remoteIdInput.addEventListener("keydown", e => {
            if (e.key === "Enter") connectToPeer();
        });

        function connectToPeer() {
            const id = remoteIdInput.value.trim();
            if (!peer || !id || id === peer.id) return;

            // Already connected? Just open the chat.
            if (connections[id]) { selectContact(id); return; }

            const c = peer.connect(id, { reliable: true });
            setupConnection(c);
            remoteIdInput.value = "";
        }

        // ---------- Shared connection setup (incoming + outgoing) ----------

        function setupConnection(c) {
            const id = c.peer;
            if (connections[id] === c) return;

            // Link is ready
            c.on("open", () => {
                connections[id] = c;
                c.status = "online";
                c.lastSeen = Date.now();

                renderContacts();
                c.send({ type: "presence", status: localStatus(), time: Date.now() });

                // Auto-select first contact
                if (!activePeerId) selectContact(id);
            });

            // Incoming data: either presence or a plain-text chat message
            c.on("data", data => {
                if (data && data.type === "presence") {
                    c.status = data.status;
                    c.lastSeen = Date.now();
                    renderContacts();
                    return;
                }
                if (typeof data === "string") appendMessage(data, "them", id);
            });

            // Link closed: keep the contact in the list, just mark offline
            c.on("close", () => {
                c.open = false;
                c.status = "offline";

                if (activePeerId === id) {
                    activePeerId = null;
                    showEmpty("Connection closed");
                }
                renderContacts();
            });

            c.on("error", err => console.error(`Connection error ${id}:`, err));
        }

        // ---------- Remove contact (with confirm) ----------

        function askRemove(id) {
            pendingRemovalId = id;
            confirmName.textContent = id;
            confirmOverlay.classList.add("show");
            confirmRemove.focus();
        }

        function closeConfirm() {
            pendingRemovalId = null;
            confirmOverlay.classList.remove("show");
        }

        confirmCancel.addEventListener("click", closeConfirm);
        confirmOverlay.addEventListener("click", e => {
            if (e.target === confirmOverlay) closeConfirm();
        });
        document.addEventListener("keydown", e => {
            if (e.key === "Escape" && confirmOverlay.classList.contains("show")) closeConfirm();
        });

        confirmRemove.addEventListener("click", () => {
            const id = pendingRemovalId;
            closeConfirm();
            if (!id) return;

            const c = connections[id];
            if (c) { try { c.close(); } catch (_) {} }
            delete connections[id];

            if (activePeerId === id) {
                activePeerId = null;
                showEmpty("Contact removed");
            }
            renderContacts();
        });

        // ---------- Contact list rendering ----------

        function renderContacts() {
            contactList.replaceChildren();

            Object.keys(connections).sort().forEach(id => {
                const li = document.createElement("li");
                li.className = "contact" + (id === activePeerId ? " active" : "");

                const name = document.createElement("span");
                name.className = "contact-name";
                name.textContent = id;

                const dot = document.createElement("span");
                dot.className = "dot " + statusClass(id);
                dot.title = statusLabel(id);

                const remove = document.createElement("button");
                remove.className = "remove";
                remove.textContent = "×";
                remove.title = `Remove ${id}`;
                remove.addEventListener("click", e => {
                    e.stopPropagation();     // don't also select the contact
                    askRemove(id);
                });

                li.append(name, dot, remove);
                li.addEventListener("click", () => selectContact(id));
                contactList.appendChild(li);
            });
        }

        // ---------- Chat selection ----------

        function selectContact(id) {
            if (!connections[id]) return;
            activePeerId = id;

            clearMessages();

            const c = connections[id];
            if (c.open) {
                messageInput.disabled = false;
                sendBtn.disabled = false;
                messageInput.focus();
            } else {
                showEmpty("Offline — reconnect to chat");
            }

            renderContacts();
        }

        // ---------- Sending messages ----------

        sendBtn.addEventListener("click", sendMessage);
        messageInput.addEventListener("keydown", e => {
            if (e.key === "Enter") { e.preventDefault(); sendMessage(); }
        });

        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text || !activePeerId) return;

            const c = connections[activePeerId];
            if (!c || !c.open) return;

            c.send(text);                       // plain string = chat message
            appendMessage(text, "me", "You");
            messageInput.value = "";
            messageInput.focus();
        }

        // ---------- Message rendering ----------

        function clearMessages() {
            messagesEl.replaceChildren();
        }

        function showEmpty(text) {
            clearMessages();
            const div = document.createElement("div");
            div.className = "empty";
            div.textContent = text;
            messagesEl.appendChild(div);

            messageInput.disabled = true;
            sendBtn.disabled = true;
        }

        function appendMessage(text, side, sender) {
            const now = new Date();

            const msg = document.createElement("div");
            msg.className = "msg " + side;

            const s = document.createElement("span");
            s.className = "msg-sender";
            s.textContent = sender;

            const t = document.createElement("span");
            t.textContent = text;

            const time = document.createElement("span");
            time.className = "msg-time";
            time.textContent = now.toLocaleTimeString([], {
                hour: "2-digit", minute: "2-digit", second: "2-digit"
            });
            time.title = now.toLocaleString();

            msg.append(s, t, time);

            // Remove the "Select a contact" placeholder if present
            const placeholder = messagesEl.querySelector(".empty");
            if (placeholder) placeholder.remove();

            messagesEl.appendChild(msg);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        // ---------- Periodic offline sweep ----------
        // Marks contacts offline if we haven't heard from them in a while.
        // Does NOT remove them — that's the user's job via the × button.
        setInterval(() => {
            let changed = false;
            Object.keys(connections).forEach(id => {
                const c = connections[id];
                if (c.lastSeen && Date.now() - c.lastSeen > PRESENCE_TIMEOUT && c.status !== "offline") {
                    c.status = "offline";
                    changed = true;
                }
            });
            if (changed) renderContacts();
        }, 2000);
    </script>
</body>
</html>
