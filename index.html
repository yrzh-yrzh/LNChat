<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LNChat</title>

    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <style>
        :root {
            --window-bg: #202124;
            --panel-bg: #292a2d;
            --input-bg: #18191b;
            --border: #45474b;
            --border-light: #5b5e63;
            --text: #eeeeee;
            --muted: #a9adb3;
            --highlight: #3d4147;
            --button: #35383d;
            --button-hover: #45494f;
            --message-me: #3b3e43;
            --danger: #d34b4b;
        }

        body.light {
            --window-bg: #f1f1f1;
            --panel-bg: #ffffff;
            --input-bg: #ffffff;
            --border: #c9c9c9;
            --border-light: #a8a8a8;
            --text: #202124;
            --muted: #686868;
            --highlight: #e5e5e5;
            --button: #eeeeee;
            --button-hover: #dedede;
            --message-me: #e2e2e2;
        }

        * {
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            margin: 0;
            overflow: hidden;
            background: var(--window-bg);
            color: var(--text);
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            font-size: 14px;
        }

        button,
        input {
            font: inherit;
        }

        button {
            border: 1px solid var(--border-light);
            border-radius: 4px;
            background: var(--button);
            color: var(--text);
            cursor: pointer;
        }

        button:hover {
            background: var(--button-hover);
        }

        button:disabled {
            cursor: default;
            opacity: 0.5;
        }

        input {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: var(--input-bg);
            color: var(--text);
            outline: none;
        }

        input:focus {
            border-color: #777;
        }

        #app {
            display: flex;
            width: 100%;
            height: 100%;
        }

        #sidebar {
            display: flex;
            flex-direction: column;
            width: 280px;
            min-width: 220px;
            background: var(--panel-bg);
            border-right: 1px solid var(--border);
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
        }

        .brand-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .brand-row h2 {
            margin: 0;
            font-size: 18px;
            font-weight: 500;
        }

        #theme-btn {
            width: 32px;
            height: 30px;
            padding: 0;
            font-size: 16px;
        }

        .current-user {
            margin-bottom: 12px;
            padding: 6px 8px;
            border-radius: 4px;
            background: var(--highlight);
            color: var(--muted);
            font-size: 12px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            cursor: pointer;
        }

        .current-user:hover {
            background: var(--button-hover);
        }

        .connection-form {
            display: flex;
            gap: 6px;
        }

        .connection-form input {
            min-width: 0;
            padding: 8px 9px;
        }

        .connection-form button {
            width: auto;
            padding: 0 11px;
            white-space: nowrap;
        }

        #contact-list {
            flex: 1;
            overflow-y: auto;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 8px;
            min-height: 44px;
            padding: 0 10px 0 16px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
        }

        .contact-item:hover {
            background: var(--highlight);
        }

        .contact-item.active {
            background: var(--highlight);
            box-shadow: inset 3px 0 0 var(--text);
        }

        .contact-name {
            flex: 1 1 auto;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .status-dot {
            width: 9px;
            height: 9px;
            flex: 0 0 9px;
            margin: 0;
            border-radius: 50%;
            background: var(--danger);
        }

        .status-dot.online {
            background: #55b86a;
        }

        .status-dot.away {
            background: #d5a943;
        }

        .status-dot.offline {
            background: var(--danger);
        }

        .remove-contact {
            flex: 0 0 22px;
            width: 22px;
            height: 22px;
            padding: 0;
            border: none;
            border-radius: 4px;
            background: transparent;
            color: var(--muted);
            font-size: 15px;
            line-height: 1;
            opacity: 0.35;
        }

        .contact-item:hover .remove-contact,
        .contact-item.active .remove-contact,
        .remove-contact:focus-visible {
            opacity: 1;
        }

        .remove-contact:hover {
            background: var(--danger);
            color: #fff;
        }

        #main {
            display: flex;
            flex: 1;
            min-width: 0;
            flex-direction: column;
        }

        #chat-window {
            display: flex;
            flex: 1;
            min-height: 0;
            flex-direction: column;
            padding: 18px;
        }

        #messages {
            display: flex;
            flex: 1;
            min-height: 0;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
            padding: 4px 4px 14px 0;
        }

        .empty-message {
            margin: auto;
            color: var(--muted);
            text-align: center;
        }

        .message {
            max-width: min(70%, 650px);
            padding: 8px 11px;
            border: 1px solid var(--border);
            border-radius: 4px;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }

        .message.me {
            align-self: flex-end;
            background: var(--message-me);
        }

        .message.them {
            align-self: flex-start;
            background: var(--panel-bg);
        }

        .message-sender {
            display: block;
            margin-bottom: 3px;
            color: var(--muted);
            font-size: 11px;
        }

        .message-time {
            display: block;
            margin-top: 5px;
            color: var(--muted);
            font-size: 11px;
            font-variant-numeric: tabular-nums;
        }

        .input-area {
            display: flex;
            gap: 7px;
            padding-top: 10px;
            border-top: 1px solid var(--border);
        }

        #message-input {
            flex: 1;
            min-width: 0;
            height: 36px;
            padding: 8px 10px;
        }

        #send-btn {
            width: auto;
            padding: 0 16px;
        }

        #overlay {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(20, 21, 22, 0.96);
        }

        body.light #overlay {
            background: rgba(241, 241, 241, 0.96);
        }

        .setup-card {
            width: 100%;
            max-width: 390px;
            padding: 24px;
            border: 1px solid var(--border-light);
            border-radius: 5px;
            background: var(--panel-bg);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
        }

        .setup-card h1 {
            margin: 0 0 16px;
            font-size: 21px;
            font-weight: 500;
        }

        .setup-card label {
            display: block;
            margin: 0 0 5px;
            color: var(--muted);
        }

        .setup-card input {
            height: 36px;
            padding: 8px 10px;
        }

        #start-btn {
            width: 100%;
            height: 36px;
            margin-top: 18px;
        }

        #setup-status {
            min-height: 17px;
            margin: 12px 0 0;
            text-align: center;
            font-size: 12px;
        }

        @media (max-width: 650px) {
            #sidebar {
                width: 210px;
                min-width: 170px;
            }

            .message {
                max-width: 85%;
            }

            .connection-form {
                flex-direction: column;
            }

            .connection-form button {
                height: 34px;
            }
        }
    </style>
</head>

<body>
    <div id="overlay">
        <div class="setup-card">
            <h1>LNChat</h1>
            <label for="my-id-input">Your ID</label>
            <input id="my-id-input" type="text" list="account-list" maxlength="40" autocomplete="off" spellcheck="false">
            <datalist id="account-list"></datalist>
            <button id="start-btn" type="button">Start</button>
            <p id="setup-status"></p>
        </div>
    </div>

    <div id="app">
        <aside id="sidebar">
            <div class="sidebar-header">
                <div class="brand-row">
                    <h2>LNChat</h2>
                    <button id="theme-btn" type="button" title="Toggle light mode" aria-label="Toggle light mode">☼</button>
                </div>
                <div class="current-user" id="current-user" title="Switch account">Not connected</div>
                <div class="connection-form">
                    <input id="remote-id-input" type="text" maxlength="40" autocomplete="off" placeholder="Peer ID">
                    <button id="add-peer-btn" type="button">Connect</button>
                </div>
            </div>
            <ul id="contact-list"></ul>
        </aside>

        <main id="main">
            <section id="chat-window">
                <div id="messages">
                    <div class="empty-message">Select a contact</div>
                </div>
                <div class="input-area">
                    <input id="message-input" type="text" autocomplete="off" placeholder="Message..." disabled>
                    <button id="send-btn" type="button" disabled>Send</button>
                </div>
            </section>
        </main>
    </div>

    <script>
        let peer = null;
        let activePeerId = null;
        let suggestedId = "";

        const connections = {};

        const PRESENCE_INTERVAL = 3000;
        const PRESENCE_TIMEOUT = 9000;

        const overlay = document.getElementById("overlay");
        const setupStatus = document.getElementById("setup-status");
        const startButton = document.getElementById("start-btn");
        const myIdInput = document.getElementById("my-id-input");
        const accountList = document.getElementById("account-list");
        const remoteIdInput = document.getElementById("remote-id-input");
        const addPeerButton = document.getElementById("add-peer-btn");
        const contactList = document.getElementById("contact-list");
        const messages = document.getElementById("messages");
        const messageInput = document.getElementById("message-input");
        const sendButton = document.getElementById("send-btn");
        const themeButton = document.getElementById("theme-btn");
        const currentUserEl = document.getElementById("current-user");

        // cookies
        function setCookie(name, value, days) {
            const d = new Date();
            d.setTime(d.getTime() + days * 864e5);
            document.cookie = name + "=" + encodeURIComponent(value) + ";expires=" + d.toUTCString() + ";path=/";
        }

        function getCookie(name) {
            const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
            return match ? decodeURIComponent(match[2]) : null;
        }

        function loadAccounts() {
            const raw = getCookie("lnchat_accounts");
            if (!raw) return [];
            try {
                const arr = JSON.parse(raw);
                return Array.isArray(arr) ? arr : [];
            } catch (e) {
                return [];
            }
        }

        function saveAccount(id) {
            const accounts = loadAccounts();
            if (!accounts.includes(id)) {
                accounts.push(id);
                setCookie("lnchat_accounts", JSON.stringify(accounts), 365);
            }
            setCookie("lnchat_current", id, 365);
            refreshAccountList();
        }

        function refreshAccountList() {
            accountList.replaceChildren();
            loadAccounts().forEach(id => {
                const opt = document.createElement("option");
                opt.value = id;
                accountList.appendChild(opt);
            });
        }

        function randomUsername() {
            const adjectives = ["quiet","silver","blue","small","curious","calm","local","hidden","soft","north"];
            const animals = ["fox","badger","owl","otter","raven","hare","lynx","finch","moth","wolf"];
            const a = adjectives[Math.floor(Math.random() * adjectives.length)];
            const b = animals[Math.floor(Math.random() * animals.length)];
            const n = Math.floor(10 + Math.random() * 90);
            return `${a}-${b}-${n}`;
        }

        suggestedId = randomUsername();
        myIdInput.placeholder = suggestedId;

        refreshAccountList();

        const savedCurrent = getCookie("lnchat_current");
        if (savedCurrent) {
            myIdInput.value = savedCurrent;
        }

        const savedTheme = localStorage.getItem("lnchat-theme");
        if (savedTheme === "light") {
            document.body.classList.add("light");
            themeButton.textContent = "☾";
            themeButton.title = "Switch to dark mode";
        }

        themeButton.addEventListener("click", () => {
            const light = document.body.classList.toggle("light");
            localStorage.setItem("lnchat-theme", light ? "light" : "dark");
            themeButton.textContent = light ? "☾" : "☼";
            themeButton.title = light ? "Switch to dark mode" : "Switch to light mode";
        });

        function setSetupStatus(text, isError = false) {
            setupStatus.textContent = text;
            setupStatus.style.color = isError ? "#d6a3a3" : "var(--muted)";
        }

        function getLocalStatus() {
            return document.hidden ? "away" : "online";
        }

        function getStatusClass(id) {
            const c = connections[id];
            if (!c || !c.open) return "offline";
            if (!c.lastPresence || Date.now() - c.lastPresence > PRESENCE_TIMEOUT) return "offline";
            return c.status === "away" ? "away" : "online";
        }

        function getStatusLabel(id) {
            const s = getStatusClass(id);
            return s === "online" ? "Online" : s === "away" ? "Away" : "Offline";
        }

        function sendPresence() {
            const presence = { type: "presence", status: getLocalStatus(), time: Date.now() };
            Object.values(connections).forEach(c => { if (c.open) c.send(presence); });
            updateContactList();
        }

        setInterval(sendPresence, PRESENCE_INTERVAL);
        document.addEventListener("visibilitychange", sendPresence);

        currentUserEl.addEventListener("click", () => {
            const cur = getCookie("lnchat_current");
            myIdInput.value = cur || "";
            setSetupStatus("");
            overlay.style.display = "flex";
            myIdInput.focus();
        });

        startButton.addEventListener("click", startPeer);

        myIdInput.addEventListener("keydown", e => {
            if (e.key === "Enter") { e.preventDefault(); startPeer(); }
        });

        function cleanupPeer() {
            Object.values(connections).forEach(c => { try { c.close(); } catch (e) {} });
            for (const k in connections) delete connections[k];
            if (peer) {
                try { peer.destroy(); } catch (e) {}
                peer = null;
            }
            activePeerId = null;
            clearMessages();
            showEmptyConversation("Select a contact");
            updateContactList();
        }

        function startPeer() {
            const id = (myIdInput.value.trim() || suggestedId).trim();

            if (!/^[A-Za-z0-9_-]{1,40}$/.test(id)) {
                setSetupStatus("Letters, numbers, - and _ only", true);
                myIdInput.focus();
                return;
            }

            cleanupPeer();

            setSetupStatus("Connecting...");
            startButton.disabled = true;
            myIdInput.disabled = true;

            peer = new Peer(id);

            peer.on("open", actualId => {
                overlay.style.display = "none";
                document.title = `LNChat — ${actualId}`;
                saveAccount(actualId);
                currentUserEl.textContent = `You: ${actualId}`;
                startButton.disabled = false;
                myIdInput.disabled = false;
            });

            peer.on("connection", c => prepareConnection(c));

            peer.on("error", err => {
                console.error("PeerJS error:", err);

                if (overlay.style.display !== "none") {
                    if (err.type === "unavailable-id") {
                        setSetupStatus("ID taken", true);
                    } else {
                        setSetupStatus("Server error", true);
                    }
                    startButton.disabled = false;
                    myIdInput.disabled = false;
                    return;
                }

                if (err.type === "peer-unavailable") {
                    remoteIdInput.placeholder = "Not reachable";
                    setTimeout(() => { remoteIdInput.placeholder = "Peer ID"; }, 2500);
                }
            });
        }

        addPeerButton.addEventListener("click", connectToPeer);
        remoteIdInput.addEventListener("keydown", e => {
            if (e.key === "Enter") connectToPeer();
        });

        function connectToPeer() {
            const remoteId = remoteIdInput.value.trim();
            if (!peer || !remoteId || remoteId === peer.id) return;
            if (connections[remoteId]) { selectContact(remoteId); return; }

            const c = peer.connect(remoteId, { reliable: true });
            prepareConnection(c);
            remoteIdInput.value = "";
        }

        function prepareConnection(c) {
            const id = c.peer;
            if (connections[id] === c) return;

            c.on("open", () => {
                connections[id] = c;
                c.status = "online";
                c.lastPresence = Date.now();
                updateContactList();
                c.send({ type: "presence", status: getLocalStatus(), time: Date.now() });
                if (!activePeerId) selectContact(id);
            });

            c.on("data", data => {
                if (data && data.type === "presence") {
                    c.status = data.status;
                    c.lastPresence = Date.now();
                    updateContactList();
                    return;
                }
                if (typeof data === "string") appendMessage(data, "them", id);
            });

            c.on("close", () => {
                const removed = c.removedByUser === true;
                if (connections[id] === c) delete connections[id];
                if (activePeerId === id && !removed) {
                    activePeerId = null;
                    showEmptyConversation("Connection closed");
                }
                updateContactList();
            });

            c.on("error", err => console.error(`Connection error ${id}:`, err));
        }

        function removeContact(id) {
            const c = connections[id];
            if (!c) return;
            c.removedByUser = true;
            try { c.close(); } catch (e) {}
            delete connections[id];
            if (activePeerId === id) {
                activePeerId = null;
                showEmptyConversation("Contact removed");
            }
            updateContactList();
        }

        setInterval(() => {
            let changed = false;
            Object.keys(connections).forEach(id => {
                const c = connections[id];
                if (c.lastPresence && Date.now() - c.lastPresence > PRESENCE_TIMEOUT && c.status !== "offline") {
                    c.status = "offline";
                    changed = true;
                }
            });
            if (changed) updateContactList();
        }, 2000);

        function updateContactList() {
            contactList.replaceChildren();

            Object.keys(connections)
                .sort((a, b) => a.localeCompare(b))
                .forEach(id => {
                    const li = document.createElement("li");
                    li.className = "contact-item";
                    if (id === activePeerId) li.classList.add("active");

                    const name = document.createElement("span");
                    name.className = "contact-name";
                    name.textContent = id;

                    const dot = document.createElement("span");
                    dot.className = `status-dot ${getStatusClass(id)}`;
                    dot.title = getStatusLabel(id);

                    const rm = document.createElement("button");
                    rm.type = "button";
                    rm.className = "remove-contact";
                    rm.textContent = "×";
                    rm.title = `Remove ${id}`;
                    rm.setAttribute("aria-label", `Remove contact ${id}`);
                    rm.addEventListener("click", e => {
                        e.stopPropagation();
                        removeContact(id);
                    });

                    li.append(name, dot, rm);
                    li.addEventListener("click", () => selectContact(id));
                    contactList.appendChild(li);
                });
        }

        function selectContact(id) {
            if (!connections[id]) return;
            activePeerId = id;
            clearMessages();
            messageInput.disabled = false;
            sendButton.disabled = false;
            messageInput.focus();
            updateContactList();
        }

        sendButton.addEventListener("click", sendMessage);
        messageInput.addEventListener("keydown", e => {
            if (e.key === "Enter") { e.preventDefault(); sendMessage(); }
        });

        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text || !activePeerId) return;
            const c = connections[activePeerId];
            if (!c || !c.open) return;

            c.send(text);
            appendMessage(text, "me", "You");
            messageInput.value = "";
            messageInput.focus();
        }

        function clearMessages() {
            messages.replaceChildren();
        }

        function showEmptyConversation(text) {
            clearMessages();
            const div = document.createElement("div");
            div.className = "empty-message";
            div.textContent = text;
            messages.appendChild(div);
            messageInput.disabled = true;
            sendButton.disabled = true;
        }

        function appendMessage(text, side, sender) {
            const now = new Date();

            const msg = document.createElement("div");
            msg.className = `message ${side}`;

            const s = document.createElement("span");
            s.className = "message-sender";
            s.textContent = sender;

            const t = document.createElement("span");
            t.textContent = text;

            const time = document.createElement("span");
            time.className = "message-time";
            time.textContent = now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
            time.title = now.toLocaleString();

            msg.append(s, t, time);

            const ph = messages.querySelector(".empty-message");
            if (ph) ph.remove();

            messages.appendChild(msg);
            messages.scrollTop = messages.scrollHeight;
        }
    </script>
</body>
</html>
